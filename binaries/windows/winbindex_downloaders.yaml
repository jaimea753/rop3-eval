# Which of the KnownDLLs (the system libraries the OS loader pre-maps into
# every process, HKLM\SYSTEM\CurrentControlSet\Control\Session
# Manager\KnownDLLs) to fetch from https://winbindex.m417z.com, and which
# exact build to pin for each architecture.
#
# Winbindex indexes PE metadata (not the binaries themselves), keyed by the
# file's own sha256, under
#   https://winbindex.m417z.com/data/by_filename_compressed/<name>.json.gz
# Every real binary is served straight off Microsoft's public symbol server.
# Each entry below pins a `version` (informational -- the fileVersion string)
# and the `sha256` that identifies that exact build in winbindex's index for
# <name>; winbindex_downloaders.py looks that key up at runtime to read the
# build's PE timestamp/virtualSize, builds the symbol-server URL
# (msdl.microsoft.com/download/symbols/<name>/<timestamp><size>/<name>),
# downloads it, and verifies the result hashes back to the pinned sha256.
#
# aarch64: winbindex only crawls x64 cumulative-update packages
# (`updates_architecture = 'x64'` in its own data/config.py) -- those also
# carry the x86 WoW64 copies of these files, but never the separate ARM64
# update packages. As of this writing it has zero native aarch64 builds
# indexed for any KnownDLL (verified directly against its data: every
# by_filename_compressed/<name>.json.gz below has only machineType 332
# (x86) and 34404 (amd64) entries, never 43620 (arm64)). There is nothing
# real to pin here until winbindex gains ARM64 coverage, so no aarch64
# builds are listed below; add them the same way once it does.
downloads:
  - name: ntdll.dll
    architectures:
      x86:
        version: "10.0.28000.2804"
