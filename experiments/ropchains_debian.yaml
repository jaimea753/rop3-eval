name: Debian multi-arch binaries — ROP-chain search benchmark

libraries: ./binaries/debian/binaries
mode: ropchains
ropchains: ./rop3/examples/ropchains

# Timings must be comparable, so the binaries are analysed one at a time
# rather than 4-up in the process pool.
sequential: true

# Per-chain search timeout in seconds (0/unset = unlimited). Guards the heavy
# turing/mprotect chains against the ~100 MB libmergedlo LibreOffice blob.
chain_timeout: 1800

depth:
  default: null
  x86:     10
  x86_64:  10
  aarch64: 24
  riscv64: 24

rop3_flags:          # matches experiments/lib_multiarch_rop.yaml
  ret_imm: false
  reg_aliases: false
  keep_contradictory: false
  avoid_canary: false
  framed: true
  all: false
  allow_undeterministic: false
  allow_complex_mem: false
